<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Oakridge AU — Private Wealth Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#060A13; --bgEl:#0C1220; --card:#101828; --cardHi:#141E30;
  --border:rgba(255,255,255,0.08); --borderHi:rgba(59,130,246,0.4);
  --text:#EEF2F8; --textDim:#94A0B4; --textFaint:#626F87;
  --gold:#3B82F6; --goldBright:#38D9E8;
  --pink:#D98BA4; --purple:#9089D4; --blue:#6E93D2; --green:#6EAE87; --red:#C97575;
  --sb-width: 320px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;}
h1,h2,h3{margin:0;font-family:'Fraunces',serif;font-weight:500;}
input,select,button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}

#app{display:flex;height:100vh;width:100%;overflow:hidden;}

/* Sidebar */
.sidebar{width:230px;flex-shrink:0;background:var(--bgEl);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 14px;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px;}
.logo-word{display:flex;align-items:baseline;gap:5px;}
.logo-word span:first-child{font-size:16.5px;font-weight:500;}
.logo-word span:last-child{font-size:16.5px;font-weight:800;letter-spacing:0.3px;}
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;
  background:transparent;color:var(--textDim);font-size:13.5px;font-weight:500;text-align:left;cursor:pointer;
  border-left:2px solid transparent;width:100%;}
.nav-item svg{flex-shrink:0;}
.nav-item.active{background:rgba(198,161,91,0.12);color:var(--goldBright);font-weight:700;border-left:2px solid var(--gold);}
.nav-spacer{flex:1;}
.nav-foot{border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:2px;}
.nav-foot .nav-item{font-size:13px;color:var(--textFaint);}

/* Content */
#content{flex:1;overflow-y:auto;padding:30px 40px 70px;}
.eyebrow{font-size:11.5px;color:var(--gold);font-weight:700;letter-spacing:0.5px;margin-bottom:6px;}
.pagetitle{font-size:24px;max-width:560px;}
.section-header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:4px;}

.card{background:linear-gradient(180deg, var(--card) 0%, var(--bgEl) 100%);border:1px solid var(--border);
  border-radius:14px;}
.pad{padding:22px;}

.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.dash{grid-template-columns:var(--sb-width) 6px 1fr;align-items:start;}
.dash-resize-handle{cursor:col-resize;position:relative;align-self:stretch;}
.dash-resize-handle::after{content:"";position:absolute;top:8px;bottom:8px;left:2px;width:2px;
  background:var(--border);border-radius:2px;transition:background .15s;}
.dash-resize-handle:hover::after,.dash-resize-handle.dragging::after{background:var(--gold);width:3px;}
@media (max-width:1000px){
  .grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}
  .grid.dash{grid-template-columns:1fr !important;}
  .dash-resize-handle{display:none;}
}

.stat-label{font-size:11.5px;color:var(--textDim);margin-bottom:6px;}
.stat-value{font-family:'Fraunces',serif;font-weight:500;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;}
.stat-value.big{font-size:30px;}
.stat-sub{font-size:12px;color:var(--textFaint);margin-top:4px;}

.field{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:12px;color:var(--textDim);font-weight:500;}
.field .inputwrap{display:flex;align-items:center;background:var(--bgEl);border:1px solid var(--border);
  border-radius:9px;padding:5px;gap:6px;}
.field .inputwrap input{background:transparent;border:none;outline:none;color:var(--text);font-weight:600;
  font-size:14px;width:100%;text-align:center;min-width:0;}
.field .inputwrap span{color:var(--textFaint);font-size:13px;flex-shrink:0;}
.field .inputwrap.stepper{padding:4px;}
.step-btn{flex-shrink:0;width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;
  background:rgba(255,255,255,0.06);color:var(--textDim);font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;}
.step-btn:hover{background:rgba(255,255,255,0.12);color:var(--text);}
.step-btn:active{background:var(--gold);color:#fff;}
select.field-select{background:var(--bgEl);border:1px solid var(--border);border-radius:9px;padding:10px 12px;
  color:var(--text);font-weight:600;font-size:13.5px;outline:none;width:100%;}

.slider-row{display:flex;flex-direction:column;gap:8px;}
.slider-row .top{display:flex;justify-content:space-between;}
.slider-row .top span:first-child{font-size:12px;color:var(--textDim);font-weight:500;}
.slider-row .top span:last-child{font-size:13px;color:var(--goldBright);font-weight:700;}
input[type=range]{width:100%;height:4px;border-radius:4px;background:var(--border);
  -webkit-appearance:none;accent-color:var(--gold);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:2px solid var(--bg);}

.pill{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;
  color:var(--textDim);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.active{border-color:var(--gold);background:rgba(198,161,91,0.14);color:var(--goldBright);}

.btn-gold{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),#1D4ED8);border:none;color:#FFFFFF;font-weight:700;
  font-size:13px;cursor:pointer;}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:9px;
  background:transparent;border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;}
.btn-grad{padding:13px 0;width:100%;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--goldBright),var(--gold));color:#04141F;font-weight:800;font-size:13px;letter-spacing:0.2px;}
.btn-grad.done{background:var(--green);}
.link-btn{background:none;border:none;cursor:pointer;padding:0;font-size:12px;font-weight:700;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:10px 16px;font-size:10.5px;color:var(--textFaint);font-weight:700;letter-spacing:0.3px;}
td{padding:10px 16px;font-size:13px;border-top:1px solid var(--border);}
.table-wrap{max-height:420px;overflow-y:auto;}

.market-mini{text-align:left;padding:10px 11px;border-radius:9px;cursor:pointer;background:var(--bgEl);
  border:1px solid var(--border);width:100%;}
.market-mini.active{background:rgba(198,161,91,0.12);border-color:var(--gold);}
.market-mini .name{font-size:12.5px;font-weight:700;color:var(--text);}
.market-mini.active .name{color:var(--goldBright);}
.market-mini .sub{font-size:10.5px;color:var(--textFaint);margin-top:2px;}

.market-card{padding:18px;cursor:pointer;}
.market-card .head{display:flex;justify-content:space-between;align-items:flex-start;}
.market-card .name{font-family:'Fraunces',serif;font-size:17px;}
.risk-badge{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap;border:1px solid;}
.market-card .sub{font-size:11.5px;color:var(--textFaint);margin-top:3px;}
.market-card .stats{display:flex;gap:18px;margin-top:14px;}

.searchwrap{position:relative;}
.searchwrap svg{position:absolute;left:11px;top:10px;}
.searchwrap input{width:100%;box-sizing:border-box;padding:9px 12px 9px 32px;border-radius:8px;
  background:var(--bgEl);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;}

.insight{padding:18px;}
.insight .tag{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:11px;font-weight:700;letter-spacing:0.4px;}
.insight p{font-size:13px;color:var(--textDim);line-height:1.55;margin:0;}

.event-item{display:flex;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.event-item:last-child{border-bottom:none;padding-bottom:0;}
.event-dot{width:6px;height:6px;border-radius:99px;background:var(--gold);margin-top:6px;flex-shrink:0;}
.event-item p{font-size:13px;color:var(--textDim);line-height:1.55;margin:0;}
.event-item .src{font-size:11px;color:var(--textFaint);margin-top:5px;}

#presentation-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;
  padding:36px 56px;overflow-y:auto;}

.top-bar{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-bottom:20px;}
.top-bar .live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--textFaint);letter-spacing:0.4px;font-weight:700;}
.top-bar .live .dot{width:6px;height:6px;border-radius:99px;background:var(--green);}

.dropdown-wrap{position:relative;}
.dropdown-panel{position:absolute;top:calc(100% + 10px);left:0;width:460px;max-width:88vw;z-index:61;
  background:var(--cardHi);border:1px solid var(--border);border-radius:13px;
  box-shadow:0 24px 60px rgba(0,0,0,0.55);padding:16px;display:flex;flex-direction:column;gap:12px;}
.dropdown-backdrop{position:fixed;inset:0;z-index:60;}
.dropdown-list{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;}
.dropdown-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;
  border:none;cursor:pointer;background:transparent;text-align:left;width:100%;}
.dropdown-row.active{background:rgba(198,161,91,0.14);}
.dropdown-row .name{font-weight:700;font-size:13px;}
.dropdown-row .cat{font-size:11px;color:var(--textFaint);margin-left:8px;}
.dropdown-row .ret{font-size:12px;color:var(--goldBright);font-weight:700;}

.disclaimer{padding:20px;background:rgba(198,161,91,0.05);}
.disclaimer .tag{font-weight:700;font-size:11.5px;color:var(--gold);margin-bottom:8px;letter-spacing:0.3px;}
.disclaimer p{font-size:12px;color:var(--textFaint);line-height:1.6;margin:0;}

svg.icon{width:15px;height:15px;}

/* Market Watch widget */
.mw-fab{position:fixed;right:26px;bottom:26px;z-index:70;width:52px;height:52px;border-radius:50%;
  border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),#1D4ED8);color:#FFFFFF;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.mw-fab svg{width:22px;height:22px;}
.mw-backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.35);}
.mw-panel{position:fixed;top:20px;right:20px;bottom:20px;width:320px;z-index:81;
  background:linear-gradient(180deg, var(--card) 0%, var(--bgEl) 100%);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,0.6);display:flex;flex-direction:column;overflow:hidden;}
.mw-header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 4px;
  font-family:'Fraunces',serif;font-size:17px;color:var(--text);}
.mw-close{background:none;border:none;color:var(--textFaint);cursor:pointer;padding:4px;}
.mw-groups{flex:1;overflow-y:auto;padding:6px 10px 14px;}
.mw-group{margin-bottom:2px;}
.mw-group-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 8px;
  background:none;border:none;cursor:pointer;border-radius:9px;}
.mw-group-head:hover{background:var(--bgEl);}
.mw-group-label{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--text);}
.mw-icon{font-size:13px;}
.mw-group-right{display:flex;align-items:center;gap:8px;}
.mw-count{font-size:11px;color:var(--goldBright);font-weight:700;background:rgba(198,161,91,0.12);
  border-radius:999px;padding:2px 8px;}
.mw-chevron{display:inline-flex;color:var(--textFaint);transition:transform .15s;}
.mw-list{display:flex;flex-direction:column;padding:2px 4px 8px 30px;}
.mw-row{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border:none;
  background:none;cursor:pointer;border-radius:7px;text-align:left;width:100%;}
.mw-row:hover{background:var(--bgEl);}
.mw-row.active{background:rgba(198,161,91,0.14);}
.mw-name{font-size:12.5px;color:var(--textDim);}
.mw-row.active .mw-name{color:var(--goldBright);font-weight:700;}
.mw-ret{font-size:12px;font-weight:700;}
@media (max-width:700px){ .mw-panel{left:12px;right:12px;width:auto;} }

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   DESIGN / ICON HELPERS
   ============================================================ */
const C = { gold:"#3B82F6", goldBright:"#38D9E8", pink:"#D98BA4", purple:"#9089D4", blue:"#6E93D2", green:"#6EAE87", red:"#C97575", textDim:"#94A0B4", textFaint:"#626F87" };

function svgIcon(name){
  const S = 'stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const paths = {
    dashboard: `<rect x="3" y="3" width="7" height="7" rx="1.3" ${S}/><rect x="14" y="3" width="7" height="4" rx="1.3" ${S}/><rect x="14" y="10" width="7" height="11" rx="1.3" ${S}/><rect x="3" y="13" width="7" height="8" rx="1.3" ${S}/>`,
    studio: `<path d="M4 20V10M11 20V4M18 20v-7" ${S}/>`,
    markets: `<circle cx="12" cy="12" r="9" ${S}/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z" ${S}/>`,
    scenarios: `<circle cx="6" cy="6" r="2.3" ${S}/><circle cx="6" cy="18" r="2.3" ${S}/><circle cx="18" cy="12" r="2.3" ${S}/><path d="M6 8.3V15.7M8 6.6c4 .7 6 2 8 4" ${S}/>`,
    portfolio: `<rect x="3" y="8" width="18" height="12" rx="1.5" ${S}/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" ${S}/>`,
    analytics: `<path d="M4 20V10M11 20V4M18 20v-7M3 20h18" ${S}/>`,
    reports: `<path d="M6 3h9l4 4v14H6z" ${S}/><path d="M9 13h6M9 17h6M9 9h3" ${S}/>`,
    presentation: `<rect x="3" y="4" width="18" height="12" rx="1.3" ${S}/><path d="M8 21h8M12 16v5" ${S}/>`,
    settings: `<circle cx="12" cy="12" r="3" ${S}/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" ${S}/>`,
    help: `<circle cx="12" cy="12" r="9" ${S}/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5" ${S}/><circle cx="12" cy="17" r="0.6" fill="currentColor"/>`,
    about: `<circle cx="12" cy="12" r="9" ${S}/><path d="M12 8.2v.1" ${S}/><path d="M11 11.5h1v5.5" ${S}/>`,
    profile: `<circle cx="12" cy="8" r="3.5" ${S}/><path d="M4.5 20c1.5-4 4-6 7.5-6s6 2 7.5 6" ${S}/>`,
    super: `<path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z" ${S}/><path d="M9 12l2 2 4-4" ${S}/>`,
    search: `<circle cx="10.5" cy="10.5" r="6.5" ${S}/><path d="M20 20l-4.3-4.3" ${S}/>`,
    chevron: `<path d="M9 6l6 6-6 6" ${S}/>`,
    x: `<path d="M6 6l12 12M18 6L6 18" ${S}/>`,
    sparkle: `<path d="M12 3l1.6 4.9L18.5 9l-4.9 1.6L12 15.5l-1.6-4.9L5.5 9l4.9-1.6z" fill="currentColor"/>`,
    download: `<path d="M12 3v13M7 11l5 5 5-5M4 20h16" ${S}/>`,
    print: `<path d="M6 9V3h12v6M6 18h12v4H6zM4 9h16v7H4z" ${S}/>`,
  };

/* ============================================================
   FINANCE MATH
   ============================================================ */
function futureValue({pv,pmt,annualReturnPct,feesPct,years}){
  const netAnnual = (annualReturnPct - feesPct)/100;
  const r = Math.pow(1+netAnnual, 1/12) - 1;
  const n = Math.round(years*12);
  let fvPv, fvPmt;
  if (Math.abs(r) < 1e-9){ fvPv = pv; fvPmt = pmt*n; }
  else { fvPv = pv*Math.pow(1+r,n); fvPmt = pmt*((Math.pow(1+r,n)-1)/r); }
  return fvPv + fvPmt;
}
function requiredMonthlyContribution({pv,targetFV,annualReturnPct,feesPct,years}){
  const netAnnual = (annualReturnPct-feesPct)/100;
  const r = Math.pow(1+netAnnual,1/12)-1;
  const n = Math.round(years*12);
  const fvPv = Math.abs(r)<1e-9 ? pv : pv*Math.pow(1+r,n);
  const remaining = targetFV - fvPv;
  if (remaining <= 0) return 0;
  const factor = Math.abs(r)<1e-9 ? n : (Math.pow(1+r,n)-1)/r;
  return remaining/factor;
}
function requiredAnnualReturn({pv,pmt,targetFV,years}){
  let lo=-20, hi=60;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    const fv=futureValue({pv,pmt,annualReturnPct:mid,feesPct:0,years});
    if (fv<targetFV) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}
function requiredYears({pv,pmt,annualReturnPct,feesPct,targetFV}){
  if (futureValue({pv,pmt,annualReturnPct,feesPct,years:0}) >= targetFV) return 0;
  if (futureValue({pv,pmt,annualReturnPct,feesPct,years:80}) < targetFV) return 80;
  let lo=0, hi=80;
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    const fv=futureValue({pv,pmt,annualReturnPct,feesPct,years:mid});
    if (fv<targetFV) lo=mid; else hi=mid;
  }
  return (lo+hi)/2;
}
function buildAnnualSeries({pv,pmt,annualReturnPct,feesPct,inflationPct,years}){
  const rows=[];
  for(let y=0;y<=Math.round(years);y++){
    const fv=futureValue({pv,pmt,annualReturnPct,feesPct,years:y});
    const invested=pv+pmt*12*y;
    const real=fv/Math.pow(1+inflationPct/100,y);
    rows.push({year:y, invested:Math.round(invested), portfolio:Math.round(fv), growth:Math.round(fv-invested), real:Math.round(real)});
  }
  return rows;
}
function fmtCurrency(n, currency){
  currency = currency || "AUD";
  if (!isFinite(n)) return "—";
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  const symbol = currency==="AUD" ? "A$" : currency==="USD" ? "$" : "€";
  return sign+symbol+Math.round(abs).toLocaleString("en-AU");
}
function fmtPct(n, digits){
  digits = digits==null ? 1 : digits;
  if (!isFinite(n)) return "—";
  return n.toFixed(digits)+"%";
}
function riskColor(risk){
  if (risk.includes("Very High")) return C.red;
  if (risk.includes("High")) return C.pink;
  if (risk.includes("Medium")) return C.gold;
  return C.green;
}

function calc(){
  const inp = state.inputs;
  const fv = futureValue(inp);
  const fvNoFees = futureValue(Object.assign({}, inp, {feesPct:0}));
  const contributions = inp.pv + inp.pmt*12*inp.years;
  const growth = fv - contributions;
  const real = fv / Math.pow(1+inp.inflationPct/100, inp.years);
  const netReturn = inp.annualReturnPct - inp.feesPct;
  const cagr = contributions>0 ? (Math.pow(fv/contributions, 1/inp.years)-1)*100 : 0;
  const multiple = contributions>0 ? fv/contributions : 0;
  const feeDrag = fvNoFees - fv;
  return {fv,contributions,growth,real,netReturn,cagr,multiple,feeDrag};
}

function superYearsToRetirement(){ return Math.max(0, state.super.retireAge - state.super.age); }

function superCalc(){
  const sp = state.super;
  const years = superYearsToRetirement();
  const pmt = superAnnualContribution()/12;
  const fv = futureValue({pv:sp.balance, pmt, annualReturnPct:sp.returnPct, feesPct:sp.feesPct, years});
  const contributions = sp.balance + superAnnualContribution()*years;
  const growth = fv - contributions;
  const real = fv / Math.pow(1+state.inputs.inflationPct/100, years);
  const concessionalUsed = superAnnualContribution();
  const overCap = concessionalUsed > sp.concessionalCap;
  const yearsToTarget = requiredYears({pv:sp.balance, pmt, annualReturnPct:sp.returnPct, feesPct:sp.feesPct, targetFV:sp.target});
  return {years, pmt, fv, contributions, growth, real, concessionalUsed, overCap, yearsToTarget};
}

function withFocusPreserved(fn){
  const active = document.activeElement;
  const key = active && active.dataset ? (active.dataset.input||active.dataset.range||active.dataset.text) : null;
  const selStart = active && typeof active.selectionStart==="number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd==="number" ? active.selectionEnd : null;
  const scrollY = window.scrollY, scrollX = window.scrollX;
  fn();
  if (key){
    const el = document.querySelector('[data-input="'+key+'"],[data-range="'+key+'"],[data-text="'+key+'"]');
    if (el){
      el.focus({preventScroll:true});
      if (selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  window.scrollTo(scrollX, scrollY);
}

/* Coalesce rapid-fire input/slider events into one render per animation frame,
   so dragging a slider or typing doesn't trigger a full re-render on every tick. */
let _rafPending = false;
let _rafMode = null; // 'full' or 'lite'
function scheduleUpdate(mode){
  if (_rafPending){ if (mode==='full') _rafMode = 'full'; return; }
  _rafPending = true;
  _rafMode = mode;
  requestAnimationFrame(function(){
    _rafPending = false;
    const m = _rafMode; _rafMode = null;
    if (m === 'full') withFocusPreserved(render);
    else withFocusPreserved(liteUpdateDashboardInputs);
  });
}
function scheduleRender(){ scheduleUpdate('full'); }
function scheduleLiteUpdate(){ scheduleUpdate('lite'); }

/* Simple SVG area/line chart */
function chartSVG(data, currency, opts){
  opts = opts || {};
  const W = opts.width||900, H = opts.height||300;
  const marginL=64, marginR=16, marginT=14, marginB=28;
  const plotW = W-marginL-marginR, plotH = H-marginT-marginB;
  const maxYear = data[data.length-1].year || 1;
  const maxVal = Math.max(...data.map(d=>Math.max(d.portfolio,d.invested,d.real))) * 1.08 || 1;
  const x = (yr)=> marginL + (yr/maxYear)*plotW;
  const y = (v)=> marginT + plotH - (v/maxVal)*plotH;
  function linePts(field){ return data.map(d=> x(d.year)+","+y(d[field])).join(" L "); }
  function areaPath(field){
    const base = marginT+plotH;
    return "M "+x(data[0].year)+","+base+" L "+linePts(field)+" L "+x(data[data.length-1].year)+","+base+" Z";
  }
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const yy = marginT+plotH*(1-f);
    const val = maxVal*f;
    return `<line x1="${marginL}" y1="${yy}" x2="${W-marginR}" y2="${yy}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 6"/>
      <text x="${marginL-8}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="${C.textFaint}" font-family="Manrope">${fmtCurrency(val,currency).replace(/\\.\\d+$/,'')}</text>`;
  }).join("");
  const stepYears = Math.max(1, Math.round(maxYear/8));
  let xLabels = "";
  for(let yr=0; yr<=maxYear; yr+=stepYears){
    xLabels += `<text x="${x(yr)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${C.textFaint}" font-family="Manrope">Yr ${yr}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="pf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${C.gold}" stop-opacity="0.35"/><stop offset="100%" stop-color="${C.gold}" stop-opacity="0"/></linearGradient>
      <linearGradient id="rf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${C.blue}" stop-opacity="0.22"/><stop offset="100%" stop-color="${C.blue}" stop-opacity="0"/></linearGradient>
    </defs>
    ${gridLines}
    <path d="${areaPath('real')}" fill="url(#rf)" stroke="${C.blue}" stroke-width="2"/>
    <path d="${areaPath('portfolio')}" fill="url(#pf)" stroke="${C.gold}" stroke-width="2.5"/>
    <path d="M ${linePts('invested')}" fill="none" stroke="${C.textFaint}" stroke-width="1.6" stroke-dasharray="4 3"/>
    ${xLabels}
  </svg>
  <div style="display:flex;gap:20px;justify-content:center;margin-top:8px;font-family:Manrope;font-size:12px;color:${C.textDim}">
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:99px;background:${C.gold};margin-right:6px"></span>Projected Portfolio</span>
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:99px;background:${C.textFaint};margin-right:6px"></span>Total Invested</span>
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:99px;background:${C.blue};margin-right:6px"></span>Real Portfolio Value</span>
  </div>`;
}

function barChartSVG(data, currency, opts){
  opts = opts || {};
  const W = opts.width||900, H=opts.height||260;
  const marginL=64, marginR=16, marginT=14, marginB=28;
  const plotW=W-marginL-marginR, plotH=H-marginT-marginB;
  const n = data.length;
  const maxVal = Math.max(...data.map(d=>d.portfolio))*1.08 || 1;
  const bw = plotW/n*0.6;
  const gap = plotW/n;
  const y=(v)=>marginT+plotH-(v/maxVal)*plotH;
  let bars="";
  data.forEach((d,i)=>{
    const cx = marginL + gap*i + gap*0.2;
    const investedH = plotH - (y(d.invested)-marginT);
    const growthH = (y(d.invested)) - y(d.portfolio);
    bars += `<rect x="${cx}" y="${y(d.invested)}" width="${bw}" height="${Math.max(0,investedH)}" fill="${C.textFaint}" opacity="0.55"/>
      <rect x="${cx}" y="${y(d.portfolio)}" width="${bw}" height="${Math.max(0,growthH)}" fill="${C.gold}"/>`;
  });
  const stepYears = Math.max(1, Math.round(n/10));
  let xLabels="";
  data.forEach((d,i)=>{ if (i%stepYears===0) xLabels += `<text x="${marginL+gap*i+gap*0.5}" y="${H-8}" text-anchor="middle" font-size="10" fill="${C.textFaint}" font-family="Manrope">Yr ${d.year}</text>`; });
  const gridLines=[0,0.5,1].map(f=>{
    const yy=marginT+plotH*(1-f), val=maxVal*f;
    return `<line x1="${marginL}" y1="${yy}" x2="${W-marginR}" y2="${yy}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 6"/>
      <text x="${marginL-8}" y="${yy+4}" text-anchor="end" font-size="10.5" fill="${C.textFaint}" font-family="Manrope">${fmtCurrency(val,currency).replace(/\\.\\d+$/,'')}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${gridLines}${bars}${xLabels}</svg>
  <div style="display:flex;gap:20px;justify-content:center;margin-top:8px;font-family:Manrope;font-size:12px;color:${C.textDim}">
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${C.textFaint};margin-right:6px"></span>Invested</span>
    <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${C.gold};margin-right:6px"></span>Growth</span>
  </div>`;
}

  ["superannuation","Superannuation","super"], ["studio","Wealth Studio","studio"], ["scenarios","Scenarios","scenarios"],
  ["portfolio","Portfolio","portfolio"], ["analytics","Analytics","analytics"], ["reports","Reports","reports"],
  ["presentation","Client Presentation","presentation"],
];
const NAV_FOOT = [["settings","Settings","settings"], ["help","Help","help"], ["profile","Advisor Profile","profile"]];

function renderSidebar(){
  const items = NAV_MAIN.map(([id,label,icon])=>
    `<button class="nav-item ${state.section===id?'active':''}" data-action="nav" data-value="${id}">${svgIcon(icon)}${label}</button>`).join("");
  const foot = NAV_FOOT.map(([id,label,icon])=>
    `<button class="nav-item ${state.section===id?'active':''}" data-action="nav" data-value="${id}">${svgIcon(icon)}${label}</button>`).join("");
  return `<div class="sidebar">
    ${logoHTML(28)}
    <div class="nav-group">${items}</div>
    <div class="nav-spacer"></div>
    <div class="nav-foot">${foot}</div>
  </div>`;
}

function marketDropdownHTML(){
  const mk = market();
  const filtered = MARKETS.filter(x=>{
    const catOk = state.dropdownCategory==="All Markets" || x.category===state.dropdownCategory;
    const qOk = !state.dropdownQuery.trim() || x.name.toLowerCase().includes(state.dropdownQuery.trim().toLowerCase());
    return catOk && qOk;
  });
  const panel = state.dropdownOpen ? `
    <div class="dropdown-backdrop" data-action="closeDropdown"></div>
    <div class="dropdown-panel">
      <div class="searchwrap">${svgIcon('search')}<input data-text="dropdownQuery" placeholder="Search all markets…" value="${state.dropdownQuery}"/></div>
      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;">
        ${CATEGORIES.map(c=>pillHTML(c, state.dropdownCategory===c, "dropdownCategory", c)).join("")}
      </div>
      <div class="dropdown-list">
        ${filtered.length===0 ? `<div style="font-size:12.5px;color:${C.textFaint};padding:10px 4px;">No markets match "${state.dropdownQuery}".</div>` : ""}
        ${filtered.map(x=>`<button class="dropdown-row ${x.id===mk.id?'active':''}" data-action="selectMarketDropdown" data-value="${x.id}">
          <span><span class="name" style="color:${x.id===mk.id?C.goldBright:'inherit'}">${x.name}</span><span class="cat">${x.category}</span></span>
          <span class="ret">${fmtPct(x.ret)}</span>
        </button>`).join("")}
      </div>
    </div>` : "";
  return `<div class="dropdown-wrap">
    <span class="field-label" style="display:block;margin-bottom:6px;">Market</span>
    <button class="field-select" data-action="toggleDropdown" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;">
      ${mk.name} <span style="transform:rotate(${state.dropdownOpen?90:0}deg);display:inline-flex;">${svgIcon('chevron')}</span>
    </button>
    ${panel}
  </div>`;
}

function pickMarketSelectHTML(){
  const mk = market();
  const cats = CATEGORIES.filter(c=>c!=="All Markets");
  const optgroups = cats.map(cat=>{
    const opts = MARKETS.filter(x=>x.category===cat)
      .map(x=>`<option value="${x.id}" ${x.id===mk.id?'selected':''}>${x.name} (${fmtPct(x.ret)})</option>`).join("");

function renderScenarios(){
  const inp = state.inputs, cur = state.currency;
  const cards = SCENARIO_DEFS.map(sc=>{
    const fv = futureValue({pv:inp.pv, pmt:inp.pmt, annualReturnPct:sc.returnPct, feesPct:sc.feesPct, years:inp.years});
    const invested = inp.pv + inp.pmt*12*inp.years;
    const active = inp.annualReturnPct===sc.returnPct && inp.feesPct===sc.feesPct;
    return `<div class="card pad" style="border:1px solid ${active?sc.color:'var(--border)'};">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <div style="width:9px;height:9px;border-radius:99px;background:${sc.color};"></div>
        <div style="font-family:Fraunces,serif;font-size:20px;">${sc.name}</div>
      </div>
      <p style="font-size:12.5px;color:${C.textDim};line-height:1.5;margin-top:0;">${sc.desc}</p>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px;">
        ${statHTML("Return assumption", fmtPct(sc.returnPct))}
        ${statHTML("Future value", fmtCurrency(fv,cur), {accent:sc.color, big:true})}
        ${statHTML("Total invested", fmtCurrency(invested,cur))}
        ${statHTML("Growth", fmtCurrency(fv-invested,cur), {accent:C.green})}
      </div>
      <button data-action="useScenarioFull" data-value="${sc.id}" style="margin-top:18px;width:100%;padding:11px 0;border-radius:9px;cursor:pointer;
        border:${active?'none':'1px solid '+sc.color};background:${active?sc.color:'transparent'};color:${active?'#FFFFFF':sc.color};font-weight:700;font-size:13px;">
        ${active?'Scenario Applied':'Use Scenario'}
      </button>
    </div>`;
  }).join("");

   ============================================================ */
function runMonteCarlo({pv,pmt,years,meanPct,volPct,sims}){
  sims = sims||1500;
  const months = Math.round(years*12);
  const mu = meanPct/100/12, sigma = (volPct/100)/Math.sqrt(12);
  const results=[];
  for(let s=0;s<sims;s++){
    let bal=pv;
    for(let mo=0;mo<months;mo++){
      const u1=Math.random(), u2=Math.random();
      const z = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
      bal = bal*(1+mu+sigma*z)+pmt;
    }
    results.push(bal);
  }
  results.sort((a,b)=>a-b);
  const pct=(p)=>results[Math.min(results.length-1, Math.floor(p*results.length))];
  return {p10:pct(0.10), p25:pct(0.25), median:pct(0.5), p75:pct(0.75), p90:pct(0.90)};
}
function estimateProb(mcRes, target){
  const points=[[0.10,mcRes.p10],[0.25,mcRes.p25],[0.5,mcRes.median],[0.75,mcRes.p75],[0.90,mcRes.p90]];
  if (target<=points[0][1]) return 95;
  if (target>=points[4][1]) return 5;
  for(let i=0;i<points.length-1;i++){
    const [pa,va]=points[i], [pb,vb]=points[i+1];
    if (target>=va && target<=vb){
      const frac=(target-va)/(vb-va);
      const cumA=(1-pa)*100, cumB=(1-pb)*100;
      return Math.round(cumA+frac*(cumB-cumA));
    }
  }
  return 50;
}

function marketWatchPanelHTML(){
  if (!state.marketWatchOpen) return "";
  const mk = market();
  const q = state.marketWatchQuery.trim().toLowerCase();
  const groups = marketWatchGroups();
  const rows = groups.map(g=>{
    const filtered = q ? g.list.filter(x=>x.name.toLowerCase().includes(q)) : g.list;
    if (q && filtered.length===0) return "";
    const expanded = !!state.marketWatchExpanded[g.key] || (q.length>0);
    return `<div class="mw-group">
      <button class="mw-group-head" data-action="toggleMWGroup" data-value="${g.key}">
        <span class="mw-group-label"><span class="mw-icon">${g.icon}</span>${g.label}</span>
        <span class="mw-group-right"><span class="mw-count">${q ? filtered.length : g.list.length}</span>
          <span class="mw-chevron" style="transform:rotate(${expanded?90:0}deg)">${svgIcon('chevron')}</span></span>
      </button>
      ${expanded ? `<div class="mw-list">${filtered.map(x=>`<button class="mw-row ${x.id===mk.id?'active':''}" data-action="selectMarketWatch" data-value="${x.id}">
        <span class="mw-name">${x.name}</span><span class="mw-ret" style="color:${x.ret>=0?C.green:C.red}">${x.ret>=0?'+':''}${fmtPct(x.ret)}</span>
      </button>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
  return `<div class="mw-backdrop" data-action="closeMarketWatch"></div>
  <div class="mw-panel">
    <div class="mw-header"><span>Market Watch</span><button class="mw-close" data-action="closeMarketWatch">${svgIcon('x')}</button></div>
    <div class="searchwrap" style="margin:8px 14px 6px;">${svgIcon('search')}<input data-text="marketWatchQuery" placeholder="Search…" value="${state.marketWatchQuery}"/></div>
    <div class="mw-groups">${rows}</div>
  </div>`;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  if (state.section === "presentation"){
    app.innerHTML = `<div id="presentation-overlay" style="display:flex;">${renderPresentation()}</div>`;
    return;
  }
  let body = "";
  if (state.section==="dashboard") body = renderDashboard();
  else if (state.section==="studio") body = renderStudio();
  else if (state.section==="markets") body = renderMarkets();
  else if (state.section==="scenarios") body = renderScenarios();
  else if (state.section==="portfolio") body = renderPortfolio();
  else if (state.section==="superannuation") body = renderSuperannuation();
  else if (state.section==="analytics") body = renderAnalytics();
  else if (state.section==="reports") body = renderReports();
  else if (state.section==="settings") body = renderSettings();
  else if (state.section==="about") body = renderAbout();
  else if (state.section==="help") body = renderHelp();
  else if (state.section==="profile") body = renderProfile();

  app.innerHTML = `${renderSidebar()}<div id="content">${body}</div>${marketWatchFabHTML()}${marketWatchPanelHTML()}`;
}

/* ============================================================
   EVENT HANDLING (delegation)
   ============================================================ */
document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action, value = btn.dataset.value;

  if (action==="nav"){ state.section = value; if(value!=="presentation"){} withFocusPreserved(render); window.scrollTo(0,0); return; }
  if (action==="closePresentation"){ state.section="dashboard"; withFocusPreserved(render); return; }
  if (action==="selectMarket"){ state.selectedMarketId = value; state.inputs.annualReturnPct = MARKET_BY_ID[value].ret; withFocusPreserved(render); return; }
  if (action==="selectMarketDropdown"){ state.selectedMarketId = value; state.inputs.annualReturnPct = MARKET_BY_ID[value].ret; state.dropdownOpen=false; withFocusPreserved(render); return; }
  if (action==="toggleDropdown"){ state.dropdownOpen = !state.dropdownOpen; withFocusPreserved(render); return; }
  if (action==="closeDropdown"){ state.dropdownOpen = false; withFocusPreserved(render); return; }
  if (action==="dropdownCategory"){ state.dropdownCategory = value; withFocusPreserved(render); return; }
  if (action==="marketCategory"){ state.marketCategory = value; withFocusPreserved(render); return; }
  if (action==="sidebarMarketCategory"){ state.sidebarMarketCategory = value; withFocusPreserved(render); return; }
  if (action==="solveFor"){ state.solveFor = value; withFocusPreserved(render); return; }
  if (action==="currencyPill"){ state.currency = value; withFocusPreserved(render); return; }
  if (action==="stepField"){
    const parts = value.split(":");
    const key = parts[0];
    const delta = parseFloat(parts[1]);
    const min = parts[2]!=="" ? parseFloat(parts[2]) : -Infinity;
    const max = parts[3]!=="" ? parseFloat(parts[3]) : Infinity;
    let target, targetKey;
    if (key.indexOf("super_")===0){ target = state.super; targetKey = key.slice(6); }
    else if (key==="targetWealth"){ target = state; targetKey = "targetWealth"; }
    else if (key==="monteCarloTarget"){ target = state; targetKey = "monteCarloTarget"; }
    else { target = state.inputs; targetKey = key; }
    const raw = (target[targetKey]||0) + delta;
    target[targetKey] = Math.round(Math.max(min, Math.min(max, raw)) * 1000) / 1000;
    if (DASH_LITE_KEYS.includes(key) && state.section==="dashboard") withFocusPreserved(liteUpdateDashboardInputs);
    else withFocusPreserved(render);
    return;
  }
  if (action==="useScenario" || action==="useScenarioFull"){
    const sc = SCENARIO_DEFS.find(s=>s.id===value);
    state.inputs.annualReturnPct = sc.returnPct; state.inputs.feesPct = sc.feesPct;
    withFocusPreserved(render); return;
  }
  if (action==="calculate"){
    state.justCalculated = true; withFocusPreserved(render);
    const anchor = document.getElementById("chart-anchor");
    if (anchor) anchor.scrollIntoView({behavior:"smooth", block:"start"});
    setTimeout(()=>{ state.justCalculated=false; withFocusPreserved(render); }, 1600);
    return;
  }
  if (action==="print"){ window.print(); return; }
  if (action==="downloadCSV"){ downloadCSV(); return; }
  if (action==="runMonteCarlo"){
    state.monteCarlo = runMonteCarlo({pv:state.inputs.pv, pmt:state.inputs.pmt, years:state.inputs.years, meanPct:market().ret, volPct:market().vol});
    withFocusPreserved(render); return;
  }
  if (action==="toggleMarketWatch"){ state.marketWatchOpen = !state.marketWatchOpen; withFocusPreserved(render); return; }
  if (action==="closeMarketWatch"){ state.marketWatchOpen = false; withFocusPreserved(render); return; }
  if (action==="toggleMWGroup"){ state.marketWatchExpanded[value] = !state.marketWatchExpanded[value]; withFocusPreserved(render); return; }
  if (action==="selectMarketWatch"){ state.selectedMarketId = value; state.inputs.annualReturnPct = MARKET_BY_ID[value].ret; withFocusPreserved(render); return; }
});

const DASH_LITE_KEYS = ["pv","pmt","years","annualReturnPct","feesPct","inflationPct"];
document.addEventListener("input", function(e){
  const t = e.target;
  if (t.dataset && t.dataset.input){
    const key = t.dataset.input;
    if (key.indexOf("super_")===0){
      state.super[key.slice(6)] = parseFloat(t.value)||0;
      scheduleRender();
    } else if (key==="targetWealth"){
      state.targetWealth = parseFloat(t.value)||0;
      scheduleRender();
    } else if (key==="monteCarloTarget"){
      state.monteCarloTarget = parseFloat(t.value)||0;
      scheduleRender();
    } else if (DASH_LITE_KEYS.includes(key)){
      state.inputs[key] = parseFloat(t.value)||0;
      if (state.section==="dashboard") scheduleLiteUpdate(); else scheduleRender();
    } else if (state.inputs[key] !== undefined){
      state.inputs[key] = parseFloat(t.value)||0;
      scheduleRender();
    }
  }
  if (t.dataset && t.dataset.range){
    const key = t.dataset.range;
    if (key.indexOf("super_")===0){
      state.super[key.slice(6)] = parseFloat(t.value)||0;
      scheduleRender();
    } else if (key==="targetWealth"){
      state.targetWealth = parseFloat(t.value)||0;
      scheduleRender();
    } else if (key==="monteCarloTarget"){
      state.monteCarloTarget = parseFloat(t.value)||0;
      scheduleRender();
    } else {
      state.inputs[key] = parseFloat(t.value)||0;
      if (DASH_LITE_KEYS.includes(key) && state.section==="dashboard") scheduleLiteUpdate(); else scheduleRender();
    }
  }
  if (t.dataset && t.dataset.text){
    const key = t.dataset.text;
    if (key==="dropdownQuery") state.dropdownQuery = t.value;
    else if (key==="marketQuery") state.marketQuery = t.value;
    else if (key==="sidebarMarketQuery") state.sidebarMarketQuery = t.value;
    else if (key==="advisorName") state.advisorName = t.value;
    else if (key==="advisorFirm") state.advisorFirm = t.value;
    else if (key==="marketWatchQuery") state.marketWatchQuery = t.value;
    scheduleRender();
  }
});

document.addEventListener("change", function(e){
  if (e.target.matches('select[data-action="currency"]')){ state.currency = e.target.value; withFocusPreserved(render); return; }
  if (e.target.matches('select[data-action="pickMarket"]')){
    state.selectedMarketId = e.target.value;
    state.inputs.annualReturnPct = MARKET_BY_ID[e.target.value].ret;
    withFocusPreserved(render);
    return;
  }
});

/* Sidebar resize handle — drag to widen/narrow the Scenario Builder column.
   Uses a CSS variable on the root element, so dragging never triggers a re-render. */
let _resizing = false, _resizeStartX = 0, _resizeStartWidth = 320;
function _currentSbWidth(){
  const v = getComputedStyle(document.documentElement).getPropertyValue('--sb-width').trim();
  return parseInt(v) || 320;
}
document.addEventListener("mousedown", function(e){
  const handle = e.target.closest(".dash-resize-handle");
  if (!handle) return;
  _resizing = true;
  _resizeStartX = e.clientX;
  _resizeStartWidth = _currentSbWidth();
  handle.classList.add("dragging");
  document.body.style.userSelect = "none";
});
document.addEventListener("mousemove", function(e){
  if (!_resizing) return;
  const w = Math.max(260, Math.min(520, _resizeStartWidth + (e.clientX - _resizeStartX)));
  document.documentElement.style.setProperty("--sb-width", w+"px");
});
document.addEventListener("mouseup", function(){
  if (!_resizing) return;
  _resizing = false;
  document.body.style.userSelect = "";
  const handle = document.getElementById("dash-resize-handle");
  if (handle) handle.classList.remove("dragging");
});
document.addEventListener("touchstart", function(e){
  const handle = e.target.closest(".dash-resize-handle");
  if (!handle) return;
  _resizing = true;
  _resizeStartX = e.touches[0].clientX;
  _resizeStartWidth = _currentSbWidth();
  handle.classList.add("dragging");
}, {passive:true});
document.addEventListener("touchmove", function(e){
  if (!_resizing) return;
  const w = Math.max(260, Math.min(520, _resizeStartWidth + (e.touches[0].clientX - _resizeStartX)));
  document.documentElement.style.setProperty("--sb-width", w+"px");
}, {passive:true});
document.addEventListener("touchend", function(){
  _resizing = false;
  const handle = document.getElementById("dash-resize-handle");
  if (handle) handle.classList.remove("dragging");
});

render();
</script>
